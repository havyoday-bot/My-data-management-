<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<title>Data Project Manager</title>
<style>
:root{--pri:#0b2a5b;--pri2:#16407f;--bg:#f2f5fa;--sur:#fff;--sur2:#e9eff8;--bd:#d9e1ee;--tx:#14213d;--mu:#5b6b84;--err:#c0392b;--ok:#1b7f4b;--sh:0 2px 10px rgba(11,42,91,.08)}
:root[data-theme="dark"]{--pri:#0a1a3a;--pri2:#3b6fcf;--bg:#0c1424;--sur:#15203a;--sur2:#1d2b4a;--bd:#2a3a5f;--tx:#e8eefc;--mu:#9fb0cf;--err:#ff7b6b;--sh:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.45}
h1,h2,h3{margin:0}h1{font-size:1.7rem}h3{font-size:1.05rem;margin-bottom:10px}
.screen{display:none;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.screen.active{display:block}
.wrap{max-width:760px;margin:0 auto}
.pad{padding:16px}.pad-x{padding:0 12px 24px}
.muted{color:var(--mu)}
.err{color:var(--err);min-height:1.3em;margin:6px 0;font-size:.95rem}
.card{background:var(--sur);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);margin-bottom:14px}
.card.pad{padding:16px}

/* header */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--pri);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.bar-title{flex:1;min-width:0}.bar-title h2{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{display:block;opacity:.75;font-size:.8rem}
.icon{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:1rem;cursor:pointer}
.icon.dark{background:var(--sur2);color:var(--tx);font-size:1.4rem}

/* controls */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--sur);color:var(--tx);font-size:1rem;font-weight:600;cursor:pointer}
.btn.primary{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.block{width:100%}.btn.sm{min-height:38px;padding:0 14px}
.fld{display:block;margin-bottom:14px}.fld>span{display:block;font-size:.9rem;color:var(--mu);margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sur);color:var(--tx);font:inherit}
input[type=color]{width:64px;height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--sur);padding:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri2);outline-offset:1px}
.search{margin-bottom:14px}
.switch{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.switch input{width:48px;height:26px;accent-color:var(--pri2)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.choice input{width:20px;height:20px;accent-color:var(--pri2)}
.choice:has(input:checked){border-color:var(--pri2);background:var(--sur2)}

/* auth */
.auth{padding:48px 20px;text-align:center}
.auth .card{text-align:left;margin-top:22px}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--pri2);color:#fff;font-size:2rem;font-weight:700;display:grid;place-items:center}

/* dashboard cards */
.big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;margin-bottom:14px;padding:22px 20px;border:1px solid var(--bd);border-radius:18px;background:var(--sur);box-shadow:var(--sh);color:var(--tx);text-align:left;cursor:pointer;font:inherit}
.big b{font-size:1.2rem}.big span{color:var(--mu)}
.big.accent{background:var(--pri2);border-color:var(--pri2);color:#fff}.big.accent span{color:#dbe6fb}

/* project cards */
.proj{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--sur);color:var(--tx);box-shadow:var(--sh);font:inherit;cursor:pointer}
.proj .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.proj b{overflow-wrap:anywhere}.proj .sub{color:var(--mu);font-size:.9rem;margin-top:4px}
.tag{flex:none;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--sur2);color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}

/* workspace */
.searchbar{display:flex;gap:8px;padding:10px 12px;background:var(--sur2)}.searchbar .search{margin:0;flex:1}
.selbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sur2);position:sticky;top:68px;z-index:15}
.selbar b{flex:1}
.selbar[hidden],.searchbar[hidden]{display:none}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:12px}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--sur);color:var(--tx);font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
.chip.primary{background:var(--pri2);border-color:var(--pri2);color:#fff}
.chip.warn{color:var(--err);border-color:var(--err)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--gbd,var(--bd));border-radius:14px;background:var(--gbg,var(--sur));box-shadow:var(--sh)}
table{border-collapse:collapse;min-width:100%}
th,td{padding:12px 14px;border-bottom:1px solid var(--gbd,var(--bd));color:var(--gtx,inherit);text-align:left;white-space:nowrap}
th{background:var(--ghd,var(--sur2));font-size:.9rem}
td.sr,th.sr{position:sticky;left:0;width:48px;min-width:48px;padding:12px 8px;text-align:center;background:var(--ghd,var(--sur2));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;font-weight:600}
tr.sel td{background:rgba(59,111,207,.22)}tr.sel td.sr{background:var(--pri2);color:#fff}

/* entry */
.sr-chip{display:inline-block;margin-bottom:12px;padding:3px 12px;border-radius:99px;background:var(--sur2);font-size:.85rem;font-weight:600}
.entry-actions{display:flex;gap:10px;flex-wrap:wrap}.entry-actions .btn{flex:1;min-width:110px}

[hidden]{display:none!important}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.swatch{min-height:46px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:#14213d}
.swatch.dk{color:#fff}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,30,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--sur);color:var(--tx);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.modal-box p{margin:6px 0 14px;color:var(--mu)}
.frow{display:flex;gap:8px;margin-bottom:10px}.fbtn{flex:1;height:auto;min-height:46px;padding:10px 14px;word-break:break-word}.fdel{width:52px;flex:none;font-size:1.5rem;color:var(--err)}
.m-actions{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:90%;padding:12px 18px;border-radius:12px;background:#14213d;color:#fff;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:20px}.m-actions{flex-direction:row-reverse;flex-wrap:wrap}.m-actions .btn{flex:1}}

</style>
</head>
<body>
<div id="app">

  <!-- ERROR -->
  <section id="s-error" class="screen">
    <div class="wrap pad">
      <div class="card pad">
        <h2 id="errTitle">Something went wrong</h2>
        <p id="errMsg" class="muted"></p>
        <button id="errReset" class="btn danger" type="button">Reset app data</button>
      </div>
    </div>
  </section>

  <!-- AUTH -->
  <section id="s-auth" class="screen">
    <div class="wrap auth">
      <div class="logo">D</div>
      <h1 data-i18n="welcome">Welcome</h1>
      <p id="authSub" class="muted"></p>
      <form id="authForm" class="card pad" autocomplete="off">
        <label class="fld"><span data-i18n="yourName">Your Name</span>
          <input id="authName" type="text" autocomplete="off" data-i18n-ph="yourName" placeholder="Your Name"></label>
        <label class="fld"><span data-i18n="password">Password</span>
          <input id="authPass" type="password" autocomplete="current-password" data-i18n-ph="password" placeholder="Password"></label>
        <p id="authErr" class="err"></p>
        <button id="authBtn" class="btn primary block" type="submit">Save Details</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="s-dash" class="screen">
    <header class="bar">
      <div class="bar-title">
        <small data-i18n="welcome">Welcome</small>
        <h2 id="dName"></h2>
      </div>
      <button id="btnSettings" class="icon" type="button" aria-label="Settings" data-i18n="settings">Settings</button>
    </header>
    <div class="wrap pad">
      <button id="cardCompany" class="big" type="button">
        <b data-i18n="company">Company Project</b><span id="cntCompany"></span>
      </button>
      <button id="cardPersonal" class="big" type="button">
        <b data-i18n="personal">My Personal Project</b><span id="cntPersonal"></span>
      </button>
      <button id="cardCreate" class="big accent" type="button">
        <b data-i18n="createNew">Create New Project</b><span data-i18n="startNew">Start a new project</span>
      </button>
      <button id="cardDeleted" class="big" type="button">
        <b data-i18n="deleted">Deleted Projects</b><span id="cntDeleted"></span>
      </button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="s-settings" class="screen">
    <header class="bar">
      <button class="icon js-back" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><h2 data-i18n="settings">Settings</h2></div>
    </header>
    <div class="wrap pad">
      <div class="card pad">
        <label class="fld"><span data-i18n="language">Language</span>
          <select id="selLang"></select></label>
      </div>
      <div class="card pad">
        <h3 data-i18n="appearance">Appearance</h3>
        <label class="switch"><span data-i18n="darkMode">Dark mode</span>
          <input id="chkDark" type="checkbox"></label>
      </div>
      <button id="btnLogout" class="btn block" type="button" data-i18n="logout">Log out</button>
      <p id="verTag" class="muted" style="text-align:center;margin-top:18px"></p>
    </div>
  </section>

  <!-- CREATE PROJECT -->
  <section id="s-create" class="screen">
    <header class="bar">
      <button class="icon js-back" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><h2 data-i18n="createNew">Create New Project</h2></div>
    </header>
    <div class="wrap pad">
      <div class="card pad">
        <label class="fld"><span data-i18n="projDate">Project Date</span>
          <input id="cpDate" type="date"></label>
        <label class="fld"><span data-i18n="projName">Project Name</span>
          <input id="cpName" type="text" autocomplete="off" data-i18n-ph="projName" placeholder="Project Name"></label>
        <div class="fld"><span data-i18n="projType">Project Type</span>
          <div class="choices">
            <label class="choice"><input id="cpTypeCompany" type="radio" name="cpType" value="company"><b data-i18n="company">Company Project</b></label>
            <label class="choice"><input id="cpTypePersonal" type="radio" name="cpType" value="personal"><b data-i18n="personal">My Personal Project</b></label>
          </div>
        </div>
        <p id="cpErr" class="err"></p>
        <button id="cpSave" class="btn primary block" type="button" data-i18n="saveDetails">Save Details</button>
      </div>
    </div>
  </section>

  <!-- PROJECT LIST -->
  <section id="s-list" class="screen">
    <header class="bar">
      <button class="icon js-back" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><h2 id="listTitle"></h2></div>
    </header>
    <div class="wrap pad">
      <input id="listSearch" class="search" type="search" autocomplete="off" data-i18n-ph="searchProj" placeholder="Search Project">
      <div id="listBody"></div>
    </div>
  </section>

  <!-- DELETED PROJECTS -->
  <section id="s-deleted" class="screen">
    <header class="bar">
      <button class="icon js-back" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><h2 data-i18n="deleted">Deleted Projects</h2></div>
    </header>
    <div class="wrap pad">
      <input id="delSearch" class="search" type="search" autocomplete="off" data-i18n-ph="searchDel" placeholder="Search Deleted Projects">
      <div id="delBody"></div>
    </div>
  </section>

  <!-- WORKSPACE -->
  <section id="s-work" class="screen">
    <header class="bar">
      <button class="icon js-back" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><small id="wsType"></small><h2 id="wsName"></h2></div>
      <button id="btnWsSearch" class="icon" type="button" aria-label="Search" data-i18n="search">Search</button>
    </header>
    <div id="wsSearchBar" class="searchbar" hidden>
      <input id="wsSearch" class="search" type="search" autocomplete="off" data-i18n-ph="searchData" placeholder="Search data">
      <button id="btnWsSearchClose" class="icon dark" type="button" aria-label="Close search">&times;</button>
    </div>
    <div id="selBar" class="selbar" hidden>
      <b id="selCount"></b>
      <button id="btnSelEdit" class="btn sm" type="button" data-i18n="edit">Edit</button>
      <button id="btnSelDel" class="btn sm danger" type="button" data-i18n="delete">Delete</button>
      <button id="btnSelClear" class="btn sm" type="button" data-i18n="clear">Clear</button>
    </div>
    <div class="toolbar">
      <button id="btnAddCol" class="chip" type="button" data-i18n="addCol">Add Column</button>
      <button id="btnAddData" class="chip primary" type="button" data-i18n="addData">Add Data</button>
      <button id="btnGridColor" class="chip" type="button" data-i18n="gridColor">Grid Color</button>
      <button id="btnExport" class="chip" type="button" data-i18n="export">Export Data</button>
      <button id="btnDelAll" class="chip warn" type="button" data-i18n="delAll">Delete All Data</button>
      <button id="btnDelProj" class="chip warn" type="button" data-i18n="delProj">Delete Project</button>
    </div>
    <div id="wsBody" class="pad-x"></div>
  </section>

  <!-- DATA ENTRY -->
  <section id="s-entry" class="screen">
    <header class="bar">
      <button id="enBack" class="icon" type="button" aria-label="Back">&larr;</button>
      <div class="bar-title"><small id="enSub"></small><h2 id="enTitle"></h2></div>
    </header>
    <div class="wrap pad">
      <div id="enForm" class="card pad"></div>
      <div class="entry-actions">
        <button id="btnEnPrev" class="btn" type="button" data-i18n="prev">Previous</button>
        <button id="btnEnNext" class="btn" type="button" data-i18n="next">Next</button>
        <button id="btnEnSave" class="btn primary" type="button" data-i18n="saveFinish">Save &amp; Finish</button>
      </div>
    </div>
  </section>

</div>

<!-- MODAL + TOAST -->
<div id="modal" class="modal" aria-hidden="true"><div id="modalBox" class="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

/* ---------- STORAGE (single key, always reload before write) ---------- */
function blankData() { return { version: 1, user: null, projects: [], deleted: [] }; }
function validProject(p) { return p && typeof p === 'object' && p.id && Array.isArray(p.columns) && Array.isArray(p.rows); }
/** Reads and validates stored data. Throws if corrupted (caller shows error screen). */
function loadAppData() {
  const raw = localStorage.getItem(KEY);
  if (!raw) return blankData();
  const d = JSON.parse(raw);
  if (!d || typeof d !== 'object' || !Array.isArray(d.projects) || !Array.isArray(d.deleted)) throw new Error('Invalid structure');
  if (!d.projects.every(validProject) || !d.deleted.every(validProject)) throw new Error('Invalid project');
  return d;
}
function saveAppData(d) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); DB = d; return true; }
  catch (e) { toast(t('errStorage')); return false; }
}
/** Load latest -> apply change -> save. Returns true on success. */
function mutate(fn) {
  try { const d = loadAppData(); fn(d); return saveAppData(d); }
  catch (e) { console.error(e); toast(t('errGeneric')); return false; }
}
const getProjectById = (id, d) => (d || DB).projects.find(p => p.id === id);
function updateProject(id, fn) {
  return mutate(d => { const p = getProjectById(id, d); if (!p) throw new Error('Project missing'); fn(p); p.updatedAt = new Date().toISOString(); });
}
/** Move a project to the deleted collection */
function deleteProject(id) {
  return mutate(d => {
    const i = d.projects.findIndex(p => p.id === id); if (i < 0) throw new Error('missing');
    const p = d.projects.splice(i, 1)[0]; p.deletedAt = new Date().toISOString(); d.deleted.push(p);
  });
}
/** Move a deleted project back as the chosen type, all data intact */
function restoreProject(id, type) {
  return mutate(d => {
    const i = d.deleted.findIndex(p => p.id === id); if (i < 0) throw new Error('missing');
    const p = d.deleted.splice(i, 1)[0]; delete p.deletedAt; p.type = type; p.updatedAt = new Date().toISOString(); d.projects.push(p);
  });
}
function permanentDelete(id) { return mutate(d => { d.deleted = d.deleted.filter(p => p.id !== id); }); }

/* ---------- AUTH ---------- */
function cyrb53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
/** Salted hash. SHA-256 when available, simple fallback otherwise. mode forces a method when verifying. */
async function hashPw(pw, salt, mode) {
  const s = salt + ':' + pw;
  if (mode !== 'c53' && window.crypto && crypto.subtle) {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return 'sha256:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fall through */ }
  }
  return 'c53:' + cyrb53(s);
}
function renderAuth() {
  loggedIn = false; const u = DB.user; applyLang(); show('s-auth');
  $('authName').value = u ? u.name : ''; $('authName').readOnly = !!u;
  $('authPass').value = ''; $('authErr').textContent = '';
  $('authSub').textContent = u ? t('enterPw') : t('createAcc');
  $('authBtn').textContent = u ? t('login') : t('saveDetails');
  $('authPass').autocomplete = u ? 'current-password' : 'new-password';
  setTimeout(() => (u ? $('authPass') : $('authName')).focus(), 60);
}
async function submitAuth() {
  const name = $('authName').value.trim(), pw = $('authPass').value, u = DB.user;
  try {
    if (!u) {
      if (!name) { $('authErr').textContent = t('errName'); return; }
      if (!pw) { $('authErr').textContent = t('errPass'); return; }
      const salt = uid('s'), passwordHash = await hashPw(pw, salt);
      if (!mutate(d => { d.user = { name, salt, passwordHash, settings: { lang: 'en', dark: false } }; })) return;
    } else {
      if (!pw) { $('authErr').textContent = t('errPass'); return; }
      const mode = u.passwordHash.startsWith('c53:') ? 'c53' : 'sha';
      if (await hashPw(pw, u.salt, mode) !== u.passwordHash) { $('authErr').textContent = t('errWrongPw'); return; }
    }
    loggedIn = true; $('authPass').value = ''; applySettings(); go('dash', null, { reset: true });
  } catch (e) { console.error(e); $('authErr').textContent = t('errGeneric'); }
}

    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    let data = u8.subarray(start, start + csize);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if (method !== 0) throw new Error('unsupported zip');
    out[name] = dec.decode(data);
  }
  return out;
}
function parseSharedStrings(xml) {
  const d = new DOMParser().parseFromString(xml, 'application/xml');
  return Array.from(d.getElementsByTagName('si')).map(si => Array.from(si.getElementsByTagName('t')).filter(x => x.parentNode.nodeName !== 'rPh').map(x => x.textContent).join(''));
}
function parseSheetXml(xml, shared) {
  const d = new DOMParser().parseFromString(xml, 'application/xml');
  return Array.from(d.getElementsByTagName('row')).map(row => {
    const arr = [];
    Array.from(row.getElementsByTagName('c')).forEach(c => {
      let col = 0; (c.getAttribute('r') || '').replace(/[0-9]/g, '').split('').forEach(ch => { col = col * 26 + (ch.charCodeAt(0) - 64); }); col--;
      const ty = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0]; let val = '';
      if (ty === 'inlineStr') val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
      else if (vEl) { const raw = vEl.textContent; val = ty === 's' ? (shared[+raw] || '') : (ty === 'str' || ty === 'b' || ty === 'e' || raw === '' || !isFinite(Number(raw))) ? raw : Number(raw); }
      arr[col >= 0 ? col : arr.length] = val;
    });
    return Array.from(arr, x => x == null ? '' : x);
  });
}
function parseCsv(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const d = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}
async function readOldFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.csv$/i.test(file.name)) return { kind: 'csv', rows: parseCsv(new TextDecoder().decode(buf)) };
  const files = await unzipText(buf);
  const key = files['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml' : Object.keys(files).filter(k => /worksheets/.test(k)).sort()[0];
  if (!key) throw new Error('no sheet');
  return { kind: 'xlsx', rows: parseSheetXml(files[key], files['xl/sharedStrings.xml'] ? parseSharedStrings(files['xl/sharedStrings.xml']) : []) };
}
/** Matches an old file's rows to this project's columns by header name (header row starts with "Sr"). Returns null if not recognised. */
function alignOld(p, matrix) {
  const h = matrix.findIndex((r, i) => i < 15 && String(r[0] == null ? '' : r[0]).trim().toLowerCase() === 'sr');
  if (h < 0) return null;
  const names = matrix[h].map(x => String(x).trim().toLowerCase());
  const idx = p.columns.map(c => names.indexOf(c.name.trim().toLowerCase()));
  // skip empty rows and any repeated header row ("Sr" in the first cell) so column names appear only once
  return matrix.slice(h + 1).filter(r => r.some(x => String(x).trim() !== '') && String(r[0] == null ? '' : r[0]).trim().toLowerCase() !== 'sr').map(r => idx.map(k => k < 0 || r[k] == null ? '' : r[k]));
}

/* ---------- EXPORT: only columns + rows, with each column's font style and text color ---------- */
const csvCell = v => { const s = fmtVal(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function styledCell(c, val) {
  let v = val == null ? '' : val; const s = String(v).trim();
  if (['numeric', 'integer', 'amount'].includes(c.type) && s !== '' && isFinite(Number(s))) v = Number(s);
  return { v, b: c.font === 'bold', i: c.font === 'italic', c: c.color && c.color.toLowerCase() !== '#14213d' ? c.color : null };
}
/** Header + old rows (already in the file, aligned to columns) + rows to add. Sr is renumbered 1..N. */
function buildOutRows(p, oldData, list) {
  // Row 1: project name. Row 2: column headers. Then the data rows.
  const out = [[{ v: p.name, b: true, nw: true }], [{ v: 'Sr', b: true }].concat(p.columns.map(c => ({ v: c.name, b: true })))];
  let sr = 1;
  oldData.forEach(vals => out.push([sr++].concat(p.columns.map((c, j) => styledCell(c, vals[j])))));
  list.forEach(r => out.push([sr++].concat(p.columns.map(c => styledCell(c, fmtCol(c, r.v[c.id]))))));
  return out;
}
function rowsToCsv(rows) {
  return '\ufeff' + rows.map(r => r.map(c => csvCell(c !== null && typeof c === 'object' ? c.v : c)).join(',')).join('\r\n');
}
/** Saves a file. Returns true if saved. Claude viewer uses the downloads capability; normal browsers use a standard download. */
/** Android app: write straight into Documents/DataProjectManager. Same name = the same file is overwritten. */
let fsPlugin = null;
async function saveNative(fname, data) {
  fsPlugin = fsPlugin || window.Capacitor.registerPlugin('Filesystem');
  const buf = data instanceof Blob ? await data.arrayBuffer() : new TextEncoder().encode(data).buffer;
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  try { await fsPlugin.requestPermissions(); } catch (e) { /* not needed on newer Android */ }
  await fsPlugin.writeFile({ path: 'DataProjectManager/' + fname, data: btoa(bin), directory: 'DOCUMENTS', recursive: true });
}
async function saveFile(fname, data) {
  if (NATIVE) {
    try { await saveNative(fname, data); return true; }
    catch (e) { console.error(e); modal(t('export'), `${t('errGeneric')} (${e && e.message ? e.message : e})`, [{ label: t('ok'), cls: 'primary' }]); return false; }
  }
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename: fname, data }); return true; }
      catch (e) { if (!e || e.code !== 'declined') toast(t('errGeneric')); return false; }
    }
  } catch (e) { /* fall through to normal download */ }
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  return true;
}
const exportedSet = p => new Set([...(p.exportedIds || []), ...(p.exports || []).flatMap(e => e.rowIds || [])]);
const sheetNameOf = p => (p.name.replace(/[\[\]:*?\/\\]/g, '').trim() || 'Project').slice(0, 31);
/** Remember each exported file (name, format, which rows it holds) so the next export can add only new rows to it */
function recordExport(name, kind, rowIds) {
  updateProject(curId, p => {
    p.exports = p.exports || []; const now = new Date().toISOString();
    const e = p.exports.find(x => x.name === name && x.kind === kind);
    if (e) { e.rowIds = rowIds; e.savedAt = now; } else p.exports.push({ id: uid('x'), name, kind, rowIds, savedAt: now });
  });
}
async function doExport(kind) {
  const p = cur(), rows = buildOutRows(p, [], p.rows);
  const fname = (p.name.replace(/[^\w\u0900-\u097F\- ]+/g, '').trim() || 'project') + (kind === 'xlsx' ? '.xlsx' : '.csv');
  const ok = await saveFile(fname, kind === 'xlsx' ? buildXlsx(rows, sheetNameOf(p)) : rowsToCsv(rows));
  if (ok) { recordExport(fname, kind, p.rows.map(r => r.id)); toast(NATIVE ? t('savedInDocs') : t('exported')); }
}
function resultModal(msg) {
  modal(t('addedTitle'), msg, [{ label: t('ok'), cls: 'primary' }]);
  $('modalBox').querySelector('p').style.whiteSpace = 'pre-line';
}
/** Add only the new rows to a file exported earlier from this app (no file picking needed) */
async function addToFile(recId) {
  const p = cur(), rec = (p.exports || []).find(x => x.id === recId); if (!rec) return;
  const seen = new Set(rec.rowIds), fresh = p.rows.filter(r => !seen.has(r.id));
  if (!fresh.length) { toast(t('noNewData')); return; }
  const had = p.rows.filter(r => seen.has(r.id));
  const rows = buildOutRows(p, had.map(r => p.columns.map(c => fmtCol(c, r.v[c.id]))), fresh);
  const ok = await saveFile(rec.name, rec.kind === 'xlsx' ? buildXlsx(rows, sheetNameOf(p)) : rowsToCsv(rows));
  if (ok) {
    recordExport(rec.name, rec.kind, p.rows.map(r => r.id));
    resultModal(`${fresh.length} ${t('newRowsAdded')}.\n${t('oldRowsIn')}: ${had.length}\n${t('savedAs')}: ${rec.name}\n\n${NATIVE ? t('nativeNote') : t('sameNameNote')}`);
  }
}
/** Name for the merged copy (browsers cannot overwrite the old file, so the copy gets a clear new name) */
function updatedName(oldName, kind) {
  const m = oldName.match(/^(.*?)(\.[^.]+)$/);
  const base = (m ? m[1] : oldName).replace(/ \(\d+\)$/, '').replace(/ updated \d{4}-\d{2}-\d{2} \d{2}-\d{2}$/, '');
  const d = new Date();
  return `${base} updated ${today()} ${pad(d.getHours())}-${pad(d.getMinutes())}${kind === 'xlsx' ? '.xlsx' : '.csv'}`;
}
/** Choose an earlier export file; save a copy of it with only the new rows added */
function pickOldFile() {
  const p = cur(), seen = exportedSet(p), fresh = p.rows.filter(r => !seen.has(r.id));
  if (!fresh.length) { toast(t('noNewData')); return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none';
  inp.accept = '.xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const done = () => setTimeout(() => inp.remove(), 1000);
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; done(); if (!f) return;
    try {
      const old = await readOldFile(f), data = alignOld(p, old.rows);
      if (!data) { modal(t('export'), t('errOldFile'), [{ label: t('ok'), cls: 'primary' }]); return; }
      const rows = buildOutRows(p, data, fresh), name = updatedName(f.name, old.kind);
      const ok = await saveFile(name, old.kind === 'xlsx' ? buildXlsx(rows, sheetNameOf(p)) : rowsToCsv(rows));
      if (ok) {
        recordExport(name, old.kind, p.rows.map(r => r.id));
        modal(t('addedTitle'), `${fresh.length} ${t('newRowsAdded')}.\n${t('oldRowsIn')}: ${data.length}\n${t('savedAs')}: ${name}\n\n${t('fileNote')}`, [{ label: t('ok'), cls: 'primary' }]);
        $('modalBox').querySelector('p').style.whiteSpace = 'pre-line';
      }
    } catch (e) { console.error(e); modal(t('export'), `${t('errOldFile')} (${e && e.message ? e.message : e})`, [{ label: t('ok'), cls: 'primary' }]); }
  });
  document.body.appendChild(inp); inp.click();
}
function formatModal() {
  modal(t('export'), t('exportFormat'), [
    { label: t('excelFile'), cls: 'primary', fn: () => doExport('xlsx') },
    { label: t('csvFile'), cls: 'primary', fn: () => doExport('csv') },
    { label: t('cancel') }
  ]);
}
/** Export Data button: lists files exported before (tap one to add only new data; X removes it from the list), or make a new file */
function exportModal() {
  const p = cur(); if (!p.columns.length) { toast(t('needCol')); return; }
  const recs = (p.exports || []).slice().sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt))).slice(0, 5);
  if (!recs.length) { formatModal(); return; }
  const list = recs.map(rec => {
    const seen = new Set(rec.rowIds), n = p.rows.filter(r => !seen.has(r.id)).length;
    return `<div class="frow"><button type="button" class="btn primary fbtn" data-add="${esc(rec.id)}">${esc(`${rec.name} (${rec.rowIds.length} ${t('rows')}, +${n} ${t('newWord')})`)}</button>
      <button type="button" class="btn fdel" data-del="${esc(rec.id)}" aria-label="${t('removeBtn')}">&times;</button></div>`;
  }).join('');
  modal(t('export'), t('pickFileMsg'), [{ label: t('newFile'), fn: formatModal }, { label: t('cancel') }], list);
  $('modalBox').querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { closeModal(); addToFile(b.dataset.add); }));
  $('modalBox').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    confirmBox(t('delExportT'), t('delExportM'), t('removeBtn'), () => {
      if (updateProject(curId, pr => { pr.exports = (pr.exports || []).filter(e => e.id !== b.dataset.del); })) exportModal();
    }, true);
  }));
}

/* ---------- EVENTS ---------- */
function bindEvents() {
  document.querySelectorAll('.js-back').forEach(b => b.addEventListener('click', back));
  $('errReset').onclick = () => confirmBox(t('resetTitle'), t('resetMsg'), t('resetBtn'), () => { localStorage.removeItem(KEY); location.reload(); }, true);
  $('authForm').addEventListener('submit', e => { e.preventDefault(); submitAuth(); });
  $('btnSettings').onclick = () => go('settings');
  $('cardCompany').onclick = () => go('list', 'company');
  $('cardPersonal').onclick = () => go('list', 'personal');
  $('cardCreate').onclick = () => go('create');
  $('cardDeleted').onclick = () => go('deleted');
  $('selLang').onchange = e => saveSetting('lang', e.target.value);
  $('chkDark').onchange = e => saveSetting('dark', e.target.checked);
  $('btnLogout').onclick = () => { nav = []; renderAuth(); };
  $('cpSave').onclick = saveNewProject;
  $('cpName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveNewProject(); } });
  $('listSearch').oninput = renderListBody;
  $('delSearch').oninput = renderDeletedBody;
  $('listBody').onclick = e => { const c = e.target.closest('[data-id]'); if (c) go('work', c.dataset.id); };
  $('delBody').onclick = e => { const c = e.target.closest('[data-id]'); if (c) deletedActions(c.dataset.id); };
  $('btnWsSearch').onclick = () => toggleSearch($('wsSearchBar').hidden);
  $('btnWsSearchClose').onclick = () => toggleSearch(false);
  $('wsSearch').oninput = renderGrid;
  $('btnAddCol').onclick = addColumnModal;
  $('btnAddData').onclick = () => startEntry('add');
  $('btnExport').onclick = exportModal;
  $('btnGridColor').onclick = gridColorModal;
  $('btnDelAll').onclick = deleteAllData;
  $('btnDelProj').onclick = deleteCurrentProject;
  $('btnSelEdit').onclick = () => startEntry('edit');
  $('btnSelDel').onclick = deleteSelected;
  $('btnSelClear').onclick = clearSel;
  $('enBack').onclick = entryBack;
  $('btnEnPrev').onclick = entryPrev;
  $('btnEnNext').onclick = entryNext;
  $('btnEnSave').onclick = entrySave;
  bindRowSelection(); bindEntry();
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('modal').classList.contains('open')) closeModal();
    else if ($('s-work').classList.contains('active') && !$('wsSearchBar').hidden) toggleSearch(false);
  });
  window.addEventListener('error', () => toast(t('errGeneric')));
  window.addEventListener('unhandledrejection', () => toast(t('errGeneric')));
}

/* ---------- INIT ---------- */
function init() {
  try { bindEvents(); } catch (e) { console.error(e); }
  try { DB = loadAppData(); }
  catch (e) { console.error(e); showFatal(t('corrupt'), String(e && e.message)); return; }
  try { applySettings(); applyLang(); renderAuth(); }
  catch (e) { console.error(e); showFatal(t('errGeneric'), String(e && e.message)); }
}
document.addEventListener('DOMContentLoaded', init);

</script>
